<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ÓRALE — The Mexican Spanish Codex</title>
<style>
:root {
  --ink:#10141c;
  --ink2:#181e29;
  --ink3:#222a38;
  --line:#2e3746;
  --bone:#e9e4d8;
  --dim:#8b94a6;
  --faint:#5a6375;
  --rosa:#e4007c;
  --mari:#f2a33c;
  --tala:#3e8fb0;
  --lima:#8fbf4d;
  --rojo:#e05252;
  --parch:#f1e7d0;
  --parch2:#e7d9ba;
  --sepia:#4a3a22;
  --sepia2:#7a6440;
  --ac:var(--mari);
  --ff-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-codex:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ff-mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:14px;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  font-size: 16px;
}
body {
  background: var(--ink);
  color: var(--bone);
  font-family: var(--ff-body);
  min-height: 100vh;
  overscroll-behavior: none;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
a {
  color: var(--tala);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
::selection {
  background: var(--rosa);
  color: #fff;
}
:focus-visible {
  outline: 2px solid var(--mari);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
body[data-zone=panel] {
  --ac:var(--mari);
}
body[data-zone=learn] {
  --ac:var(--tala);
}
body[data-zone=arena] {
  --ac:var(--rosa);
}
body[data-zone=codex] {
  --ac:var(--sepia2);
}
body[data-zone=cantina] {
  --ac:#d98e4a;
}
#app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background:
    linear-gradient(
      180deg,
      var(--ink) 75%,
      transparent);
  padding: 14px 16px 10px;
}
.hd-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  font-family: var(--ff-codex);
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: .06em;
  color: var(--mari);
}
.brand em {
  font-style: normal;
  color: var(--rosa);
}
.hd-stats {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}
.pill {
  background: var(--ink3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: .78rem;
  font-family: var(--ff-mono);
  display: flex;
  gap: 5px;
  align-items: center;
  white-space: nowrap;
}
.pill b {
  color: var(--mari);
}
.pill.streak b {
  color: var(--rosa);
}
.xp-wrap {
  margin-top: 9px;
}
.xp-meta {
  display: flex;
  justify-content: space-between;
  font-size: .72rem;
  color: var(--dim);
  font-family: var(--ff-mono);
  margin-bottom: 4px;
}
.xp-meta b {
  color: var(--bone);
}
.xp-bar {
  height: 7px;
  background: var(--ink3);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.xp-fill {
  height: 100%;
  background:
    linear-gradient(
      90deg,
      var(--mari),
      var(--rosa));
  border-radius: 99px;
  transition: width .5s ease;
}
main {
  flex: 1;
  padding: 6px 16px 96px;
}
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 60;
  background: var(--ink2);
  border-top: 1px solid var(--line);
  display: flex;
  max-width: 760px;
  margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1;
  padding: 10px 2px 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--faint);
  font-size: .66rem;
  letter-spacing: .04em;
  transition: color .15s;
}
nav button .ico {
  font-size: 1.15rem;
  line-height: 1;
}
nav button.on {
  color: var(--ac);
}
nav button.on .ico {
  transform: translateY(-1px);
}
.card {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: .98rem;
  margin-bottom: 8px;
  font-family: var(--ff-codex);
  letter-spacing: .03em;
}
h2.sect {
  font-family: var(--ff-codex);
  font-size: 1.35rem;
  margin: 14px 0 12px;
  letter-spacing: .03em;
}
h2.sect small {
  display: block;
  font-family: var(--ff-mono);
  font-size: .68rem;
  color: var(--dim);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--ac);
  color: #0e0d0b;
  font-weight: 700;
  border-radius: 11px;
  padding: 11px 18px;
  font-size: .92rem;
  transition: transform .1s, filter .15s;
}
.btn:active {
  transform: scale(.97);
}
.btn.ghost {
  background: var(--ink3);
  color: var(--bone);
  border: 1px solid var(--line);
  font-weight: 600;
}
.btn.wide {
  width: 100%;
}
.btn.sm {
  padding: 7px 13px;
  font-size: .8rem;
  border-radius: 9px;
}
.btn:disabled {
  opacity: .4;
  cursor: default;
}
.tag {
  display: inline-block;
  font-family: var(--ff-mono);
  font-size: .66rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--ink3);
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 6px;
  padding: 2px 8px;
}
.muted {
  color: var(--dim);
  font-size: .85rem;
  line-height: 1.5;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.spread {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.es {
  font-family: var(--ff-codex);
}
.hero-greet {
  font-family: var(--ff-codex);
  font-size: 1.5rem;
  line-height: 1.25;
  margin: 10px 0 2px;
}
.hero-greet b {
  color: var(--mari);
}
.statgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0;
}
.stat {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 10px;
  text-align: center;
}
.stat .n {
  font-family: var(--ff-mono);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--ac);
}
.stat .l {
  font-size: .66rem;
  color: var(--dim);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 2px;
}
.quest {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.quest:last-child {
  border-bottom: none;
}
.quest .chk {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  border: 2px solid var(--faint);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .8rem;
}
.quest.done .chk {
  background: var(--lima);
  border-color: var(--lima);
  color: #0e0d0b;
}
.quest.done .qt {
  text-decoration: line-through;
  color: var(--faint);
}
.qt {
  font-size: .9rem;
  flex: 1;
}
.qxp {
  font-family: var(--ff-mono);
  font-size: .72rem;
  color: var(--mari);
}
.bar-row {
  margin: 9px 0;
}
.bar-row .bl {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  margin-bottom: 4px;
}
.bar-row .bl b {
  font-family: var(--ff-mono);
  color: var(--dim);
  font-weight: 400;
}
.bar {
  height: 8px;
  background: var(--ink3);
  border-radius: 99px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--ac);
}
canvas.chart {
  width: 100%;
  height: 130px;
  display: block;
}
.hm {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  margin-top: 6px;
}
.hm .cell {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-family: var(--ff-mono);
  font-size: .6rem;
  color: var(--dim);
}
.hm .cell b {
  font-size: .74rem;
  color: var(--bone);
}
.hm .cell.lk {
  opacity: .35;
}
.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: .68rem;
  color: var(--dim);
  font-family: var(--ff-mono);
  margin-top: 10px;
}
.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 4px;
  vertical-align: -1px;
  border: 1px solid var(--line);
}
.fc-stage {
  perspective: 1100px;
  margin: 14px 0;
}
.fc {
  position: relative;
  min-height: 250px;
  transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.4, 1.4, .6, 1);
  cursor: pointer;
}
.fc.flip {
  transform: rotateY(180deg);
}
.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  gap: 10px;
}
.fc-face.back {
  transform: rotateY(180deg);
  border-color: var(--tala);
}
.fc-word {
  font-family: var(--ff-codex);
  font-size: 2rem;
  line-height: 1.2;
}
.fc-sub {
  color: var(--dim);
  font-size: .85rem;
}
.fc-hint {
  position: absolute;
  bottom: 12px;
  font-size: .68rem;
  color: var(--faint);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.srs-btns {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.srs-btns button {
  padding: 12px 4px;
  border-radius: 11px;
  font-weight: 700;
  font-size: .82rem;
  border: 1px solid var(--line);
  background: var(--ink3);
}
.srs-btns .b0 {
  color: var(--rojo);
}
.srs-btns .b1 {
  color: var(--mari);
}
.srs-btns .b2 {
  color: var(--tala);
}
.srs-btns .b3 {
  color: var(--lima);
}
.srs-btns button small {
  display: block;
  font-weight: 400;
  font-size: .62rem;
  color: var(--faint);
  font-family: var(--ff-mono);
  margin-top: 2px;
}
.speak-ico {
  background: var(--ink3);
  border: 1px solid var(--line);
  border-radius: 99px;
  width: 42px;
  height: 42px;
  font-size: 1.1rem;
  color: var(--tala);
}
.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 15px;
  margin-bottom: 9px;
  font-size: .95rem;
  transition: border-color .12s, transform .12s;
}
.opt:hover {
  border-color: var(--ac);
}
.opt:active {
  transform: scale(.98);
}
.opt.right {
  border-color: var(--lima);
  background: rgba(143, 191, 77, .12);
}
.opt.wrong {
  border-color: var(--rojo);
  background: rgba(224, 82, 82, .12);
}
.q-word {
  font-family: var(--ff-codex);
  font-size: 1.7rem;
  text-align: center;
  margin: 16px 0;
}
.q-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--ff-mono);
  font-size: .75rem;
  color: var(--dim);
  margin-bottom: 8px;
}
.timerbar {
  height: 5px;
  background: var(--ink3);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 14px;
}
.timerbar i {
  display: block;
  height: 100%;
  background: var(--rosa);
  transition: width .2s linear;
}
.game-tile {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.game-tile:active {
  transform: scale(.98);
}
.game-tile:hover {
  border-color: var(--rosa);
}
.game-tile .gt {
  font-family: var(--ff-codex);
  font-size: 1.02rem;
  color: var(--rosa);
  margin-bottom: 4px;
}
.game-tile .gd {
  font-size: .76rem;
  color: var(--dim);
  line-height: 1.4;
}
.game-tile .gx {
  font-family: var(--ff-mono);
  font-size: .66rem;
  color: var(--mari);
  margin-top: 7px;
}
.tiles {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
  min-height: 44px;
}
.tile {
  background: var(--ink3);
  border: 1px solid var(--tala);
  border-radius: 9px;
  padding: 9px 13px;
  font-family: var(--ff-codex);
  font-size: .95rem;
}
.tile:disabled {
  opacity: .25;
}
.build-out {
  min-height: 52px;
  border: 1px dashed var(--line);
  border-radius: 11px;
  padding: 9px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 6px;
}
.bigscore {
  font-family: var(--ff-mono);
  font-size: 2.6rem;
  text-align: center;
  color: var(--ac);
  margin: 10px 0;
}
.codex {
  background: var(--parch);
  color: var(--sepia);
  border-radius: 16px;
  padding: 20px 18px;
  font-family: var(--ff-codex);
  box-shadow: inset 0 0 60px rgba(122, 100, 64, .25);
  border: 1px solid var(--parch2);
}
.codex h2 {
  font-size: 1.4rem;
  letter-spacing: .04em;
  border-bottom: 2px solid var(--sepia2);
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.codex h2::first-letter {
  font-size: 1.9rem;
  color: #8c2f1b;
}
.codex .phase {
  border: 1px solid var(--parch2);
  border-radius: 11px;
  margin-bottom: 10px;
  background: rgba(255, 255, 255, .35);
  overflow: hidden;
}
.codex .phase > button {
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  font-family: var(--ff-codex);
  font-size: 1rem;
  font-weight: 700;
  color: var(--sepia);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.codex .phase .ph-body {
  padding: 0 14px 12px;
  display: none;
}
.codex .phase.open .ph-body {
  display: block;
}
.wk {
  border-top: 1px dotted var(--sepia2);
  padding: 11px 0;
}
.wk .wk-t {
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.wk .wk-t .tag {
  background: transparent;
  border-color: var(--sepia2);
  color: var(--sepia2);
}
.wk p {
  font-size: .87rem;
  line-height: 1.55;
  margin: 6px 0;
}
.wk .mission {
  font-style: italic;
  color: #8c2f1b;
}
.wk ul {
  margin: 4px 0 6px 18px;
  font-size: .85rem;
}
.wk a {
  color: #1f5b7a;
  font-weight: 600;
}
.wk .btn {
  background: var(--sepia);
  color: var(--parch);
}
.wk.done .wk-t::after {
  content: "\2713  superada";
  font-size: .7rem;
  color: #3e7a3e;
  font-family: var(--ff-mono);
}
.marginalia {
  border-left: 3px solid #8c2f1b;
  background: rgba(140, 47, 27, .07);
  padding: 9px 12px;
  font-style: italic;
  font-size: .86rem;
  border-radius: 0 9px 9px 0;
  margin: 10px 0;
}
.slang-card {
  background:
    linear-gradient(
      160deg,
      #241a12,
      #1a1410);
  border: 1px solid #4a3520;
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
}
.slang-card .sw {
  font-family: var(--ff-codex);
  font-size: 1.2rem;
  color: #e8b04a;
}
.slang-card .sm {
  font-size: .85rem;
  color: var(--bone);
  margin: 4px 0;
}
.slang-card .sx {
  font-size: .8rem;
  color: var(--dim);
  font-style: italic;
}
.ff-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  font-size: .8rem;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.ff-row b {
  color: #d98e4a;
  font-family: var(--ff-codex);
  font-size: .92rem;
}
.ff-row .no {
  color: var(--rojo);
}
.ff-row .si {
  color: var(--lima);
}
.fact {
  border-left: 3px solid #d98e4a;
  padding: 8px 12px;
  margin: 10px 0;
  font-size: .87rem;
  line-height: 1.55;
  color: var(--bone);
}
.chip {
  display: inline-block;
  background: var(--ink3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  margin: 3px;
  font-family: var(--ff-codex);
  font-size: .85rem;
}
.subtabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
}
.subtabs button {
  white-space: nowrap;
  background: var(--ink3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: .78rem;
  color: var(--dim);
}
.subtabs button.on {
  background: var(--ac);
  color: #0e0d0b;
  border-color: var(--ac);
  font-weight: 700;
}
#buddy {
  position: fixed;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: min(700px, calc(100% - 28px));
  z-index: 55;
  background: var(--parch);
  color: var(--sepia);
  border-radius: 13px;
  padding: 11px 40px 11px 14px;
  font-family: var(--ff-codex);
  font-size: .88rem;
  line-height: 1.45;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
  border: 1px solid var(--parch2);
  display: none;
  font-style: italic;
}
#buddy.show {
  display: block;
  animation: pop .35s cubic-bezier(.3, 1.5, .5, 1);
}
#buddy::before {
  content: "ANSELMO \2712";
  position: absolute;
  top: -9px;
  left: 12px;
  background: #8c2f1b;
  color: var(--parch);
  font-style: normal;
  font-family: var(--ff-mono);
  font-size: .58rem;
  letter-spacing: .14em;
  padding: 2px 8px;
  border-radius: 6px;
}
#buddy .bx {
  position: absolute;
  top: 6px;
  right: 8px;
  color: var(--sepia2);
  font-size: 1rem;
  padding: 4px;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(12px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(8, 10, 15, .8);

function mcq(c, dir) {
  dir = dir || (Math.random() < 0.5 ? "e2n" : "n2e");
  const wrong = shuffle(DECK.filter((x) => x.id !== c.id && x.cat === c.cat)).slice(0, 3);
  const q = dir === "e2n" ? c.es : c.en;
  const right = dir === "e2n" ? c.en : c.es;
  const opts = shuffle([right, ...wrong.map((w) => dir === "e2n" ? w.en : w.es)]);
  return { q, say: dir === "e2n" ? c.es : null, opts, a: opts.indexOf(right), id: c.id, es: c.es };
}
function listenQ(c) {
  const wrong = shuffle(DECK.filter((x) => x.id !== c.id)).slice(0, 3);
  const opts = shuffle([c.en, ...wrong.map((w) => w.en)]);

}

function weekTest(n) {
  buddy(pick(AN.test));
  const wk = DECK.filter((c) => c.wk === n);
  const vocabQ = shuffle(wk).slice(0, 8).map((c) => mcq(c));
  const lisQ = shuffle(wk).slice(0, 2).map((c) => listenQ(c));
  const gq = shuffle(GQ.filter((g) => g.w <= n && g.w > n - 6)).slice(0, 2).map((g) => ({ q: g.q, opts: g.o, a: g.a }));
  quizRun(shuffle([...vocabQ, ...lisQ, ...gq]), "Examen \xB7 Semana " + n, (s, t) => {
    const pct = s / t;
    if (pct >= 0.75) {
      if (!S.weeksDone.includes(n)) S.weeksDone.push(n);
      S.week = Math.max(S.week, Math.min(26, n + 1));
      S.stats.tests++;
      addXP(80);
      addPesos(30);
      toast("Semana " + n + " superada \xB7 +80 XP");
      buddy(pick(AN.win) + " La semana " + (n + 1 <= 26 ? n + 1 + " te espera." : "final... ha llegado."));
    } else {
      buddy(pick(AN.fail) + " Repara tus zonas d\xE9biles y vuelve al examen.");
    }
    save();
  }, true);
}

function bossConj(wkMax) {

  if (wkMax >= 11) {
    tenses.push(1);
    tenses.push(2);
  }
  var ti = pick(tenses);

  var v = CJ[vi];

  var b = BOSSES[ph - 1];
  BOSS = { ph, items: buildBossItems(ph), i: 0, score: 0, php: 100, bhp: 100, tmax: 15, t: 15 };
  buddy("\u2694 " + b.intro);
  bossQ();
}
function bossTick() {
  if (!BOSS) return;
  BOSS.t--;
  var bar = $("#btbar");
  if (bar) bar.style.width = BOSS.t / BOSS.tmax * 100 + "%";
  if (BOSS.t <= 0) {
    clearInterval(BOSST);
    bossHit(-1);
  }
}
function bossQ() {
  var z = BOSS;
  if (!z) return;
  if (z.i >= z.items.length || z.bhp <= 0 || z.php <= 0) return bossEnd();
  var it = z.items[z.i], b = BOSSES[z.ph - 1];
  z.t = z.tmax;
  clearInterval(BOSST);
  $("#view").innerHTML = '<div class="q-meta"><span>JEFE \xB7 ' + esc(b.name) + "</span><span>" + (z.i + 1) + "/" + z.items.length + " \xB7 " + z.score + " aciertos</span></div>" + bossBars(z) + '<div class="timerbar" style="margin-top:10px"><i id="btbar" style="width:100%"></i></div><div class="tag">' + esc(it.skill || "reto") + '</div><div class="q-word es">' + esc(it.q) + (it.say ? ' <button class="speak-ico" aria-label="Escuchar" onclick="speak(BOSS.items[BOSS.i].say)">\u266A</button>' : "") + "</div>" + it.opts.map(function(o, j) {
    return '<button class="opt" onclick="window.__boss(' + j + ')">' + esc(o) + "</button>";
  }).join("");
  if (it.listen) speak(it.say);
  BOSST = setInterval(bossTick, 1e3);
}
window.__boss = function(j) {
  bossHit(j);
};
function bossHit(j) {
  var z = BOSS;
  if (!z) return;
  clearInterval(BOSST);
  var it = z.items[z.i], b = BOSSES[z.ph - 1];
  var btns = document.querySelectorAll(".opt");
  btns.forEach(function(x) {
    x.onclick = null;
  });
  if (j === it.a) {
    z.score++;
    z.bhp = Math.max(0, z.bhp - 13);
    if (it.id && S.miss[it.id]) S.miss[it.id] = Math.max(0, S.miss[it.id] - 1);
    if (j >= 0 && btns[j]) btns[j].classList.add("right");
    if (Math.random() < 0.5) buddy(pick(b.taunt));
  } else {
    z.php = Math.max(0, z.php - 34);
    if (it.id) S.miss[it.id] = (S.miss[it.id] || 0) + 1;
    if (j >= 0 && btns[j]) btns[j].classList.add("wrong");
    if (btns[it.a]) btns[it.a].classList.add("right");
    buddy(pick(b.taunt));
  }
  z.i++;
  setTimeout(bossQ, 750);
}
function bossEnd() {
  var z = BOSS;
  if (!z) return;
  clearInterval(BOSST);
  var b = BOSSES[z.ph - 1], total = z.items.length, pct = z.score / total, win = pct >= 0.8;
  if (win) {
    S.bossDone = S.bossDone || [];
    if (!S.bossDone.includes(z.ph)) S.bossDone.push(z.ph);
    S.bossBest = S.bossBest || {};
    S.bossBest[z.ph] = Math.max(S.bossBest[z.ph] || 0, z.score);
    addXP(z.score * 10 + 40);
    addPesos(50);
    buddy("\u2694 " + b.defeat);
    checkAch();
  } else buddy(pick(AN.fail) + " El jefe sigue en pie. Repara tus zonas d\xE9biles y vuelve.");
  $("#view").innerHTML = '<div class="card" aria-live="polite" style="text-align:center;padding:26px 16px;border-color:' + (win ? "var(--lima)" : "var(--rojo)") + '"><div class="bigscore" style="color:' + (win ? "var(--lima)" : "var(--rojo)") + '">' + (win ? "\xA1VICTORIA!" : "DERROTA") + "</div><h3>" + esc(b.name) + '</h3><p class="muted">' + z.score + "/" + total + " aciertos \xB7 " + Math.round(pct * 100) + "%" + (win ? " \xB7 insignia obtenida" : " \xB7 necesitas 80%") + "</p>" + bossBars(z) + '<div class="grid2" style="margin-top:14px"><button class="btn ghost" onclick="renderBossList()">Jefes</button><button class="btn" onclick="startBoss(' + z.ph + ')">Otra vez</button></div></div>';
  renderHeader();
  save();
  BOSS = null;
}

function skillTree() {
  var mast = masteredCards().length;
  var branches = [
    { k: "Vocabulario", g: "\u25C6", v: mast, u: "palabras dominadas", th: [0, 10, 40, 100, 200, 350] },
    { k: "O\xEDdo", g: "\u266A", v: (S.stats.dlg || 0) + (S.stats.story || 0), u: "di\xE1logos + historias", th: [0, 1, 4, 10, 18, 26] },
    { k: "Voz", g: "\u25CE", v: S.stats.shadow || 0, u: "reps de sombra", th: [0, 5, 20, 50, 100, 180] },
    { k: "Gram\xE1tica", g: "\u270E", v: S.stats.conj || 0, u: "conjugaciones", th: [0, 10, 50, 120, 250, 400] },
    { k: "Callejero", g: "\u2691", v: knownSlang(), u: "jerga y dichos", th: [0, 3, 10, 20, 35, 50] }
  ];
  branches.forEach(function(b) {
    var lv = 0;
    for (var i = 0; i < b.th.length; i++) {
      if (b.v >= b.th[i]) lv = i;
    }
    b.lv = Math.min(lv, 5);
    b.nextAt = b.th[Math.min(b.lv + 1, 5)];
  });
  return branches;
}

function saveSettings() {
  S.name = $("#st-name").value || "Escudero";
  S.voice = $("#st-voice").value;
  S.slow = !!$("#st-slow").checked;
  S.week = parseInt($("#st-week").value);

  closeModal();
  go(VIEW);

}
function exportData() {
  saveNow();
  const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "orale-respaldo-" + today() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2e3);
  toast("Respaldo descargado (.json)");
}
function importText(t) {
  try {
    const o = JSON.parse(t);
    if (!o || typeof o !== "object" || Array.isArray(o)) throw 0;
    S = migrate(o);
    saveNow();
    location.reload();
  } catch (e) {
    toast("Datos inv\xE1lidos");
  }
}
function importData() {
  const i = document.createElement("input");
  i.type = "file";
  i.accept = ".json,application/json";
  i.addEventListener("change", () => {
    const f = i.files && i.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.onerror = () => toast("No se pudo leer el archivo");
    r.readAsText(f);
  });
  i.click();
}
function importPaste() {
  const t = prompt("Pega tus datos exportados:");
  if (t) importText(t);
}
function persistStorage() {
  try {
    if (typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist) {
      const p = navigator.storage.persist();
      if (p && p.catch) p.catch(() => {
      });
      return true;
    }
  } catch (e) {
  }
  return false;
}

  ["How to review a flashcard", "1. A Spanish word appears and is spoken aloud. <b>Say it out loud</b>, then say the English meaning from memory.<br>2. Tap the card to flip and check.<br>3. Grade yourself honestly:<br><b>Otra vez</b> (Again) = forgot; card returns in minutes.<br><b>Dif\xEDcil</b> (Hard) = barely got it; ~1 day.<br><b>Bien</b> (Good) = got it; interval grows (2 days, then ~5, ~12, ~30...).<br><b>F\xE1cil</b> (Easy) = instant recall; interval grows faster.<br><br>The \u266A button replays the audio. Honest grading is what makes the algorithm work."],
  ["Cabina de sombra \u2014 the speaking engine", "This is the Pimsleur technique, at home: listen to a phrase (<b>\u266A Escuchar</b>), then immediately imitate it out loud, matching speed and rhythm. Use <b>\u2212 lento / + r\xE1pido</b> to slow down or speed up the voice. When you can match the phrase, press <b>Rep lograda \u2713</b> to log it (+8 XP).<br><br><b>\u{1F399} Grabar mi voz</b> lets you record yourself saying the phrase, then <b>\u25B6 Escuchar mi grabaci\xF3n</b> plays it back so you can A/B compare against <b>\u266A Comparar con nativo</b>. <b>\u{1F5D1} Descartar</b> clears it so you can try again \u2014 recordings never leave your browser's memory (no upload, nothing saved to disk), and the feature quietly disables itself if your browser or setup doesn't support microphone access.<br><br>Ten minutes of this daily does more for your accent and fluency than any other exercise in the app."],
  ["Arena \u2014 six mini-games", "<b>Rayo</b> (Lightning) \u2014 45 seconds of rapid-fire translation.<br><b>O\xEDdo</b> (Ear) \u2014 hear a word, pick the meaning.<br><b>Trampa</b> (Trap) \u2014 false friends: words that look English but betray you.<br><b>Constructor</b> \u2014 rebuild a Mexican phrase from shuffled word tiles.<br><b>\xBFAmigo o Traidor?</b> (Friend or Traitor) \u2014 instant call: free cognate or false friend?<br><b>Asalto de Memoria</b> (Memory Raid) \u2014 5 random old cards; fail them and they return to your review queue. The app also launches surprise raids on its own \u2014 that randomness is deliberate, it forces long-term retention."],
  ["C\xF3dice \u2014 the campaign plan", "The parchment section. <b>El M\xE9todo</b> explains the daily hour: 25 min audio course (Language Transfer, then Dreaming Spanish), 20 min in this app, 10 min shadowing, 5 min Cantina.<br><br>Six phases contain 26 weeks. Each week has: a grammar note (spoken-Spanish only), a <i>Misi\xF3n hablada</i> (speaking mission \u2014 do it out loud, always), and curated free links.<br><br><b>Examen de la semana</b> = the weekly test: score 75%+ to conquer the week and unlock the next one. Failing feeds your mistakes into the Repair drill. Weeks marked <i>cerrada</i> are still locked."],
  ["Cantina \u2014 street Spanish and media", "Tabs:<br><b>Jerga</b> = Mexican slang (g\xFCey, \xF3rale, no manches...). Readable from day one; they join your flashcards at week 19.<br><b>Dichos</b> = idioms and sayings with literal translations.<br><b>Trampas</b> = the false-friend table (embarazada \u2260 embarrassed...).<br><b>Gratis</b> = cognates \u2014 hundreds of words you already own for free.<br><b>Datos</b> = fun facts about Spanish, unlocked one at a time via daily chests.<br><b>Biblioteca</b> = the full media library: songs, series, movies and the free channels that power the method."],
  ["Historias \u2014 Story Mode (the campaign)", "<b>Estudiar &rarr; Historias</b> is your campaign mode: six graded audio-stories, one per phase, that follow Mateo &mdash; a newcomer to Mexico, much like you. Each unlocks when you reach its week (4, 8, 13, 18, 22, 26).<br><br>Read and listen paragraph by paragraph (tap <b>&#9834; Escuchar</b>; adjust speed with <b>&minus; lento / + r&aacute;pido</b>), then answer <b>5 comprehension questions</b>. About 90% of each story uses vocabulary you have already unlocked, so it doubles as review. Finishing a story earns XP and marks it <i>le&iacute;da</i> &mdash; collect all six to become Cronista de &Oacute;ralelandia."],
  ["Jefes de Fase y el \xC1rbol de Habilidades", "<b>Arena &rarr; Jefes de Fase</b> turns each phase-end into a boss fight: a timed, mixed-skill duel (vocabulary, listening, grammar, conjugation and slang) with a health bar for you and one for the boss. Each correct answer damages the boss; each miss (or letting the timer run out) damages you. Land enough hits to reach <b>80%+</b> and you win the fight and its badge &mdash; three misses and the boss wins. There are six bosses, one per phase, unlocking at weeks 4, 8, 13, 18, 22 and 26.<br><br><b>Arena &rarr; &Aacute;rbol de Habilidades</b> is your RPG character sheet: five branches &mdash; Vocabulario, O&iacute;do, Voz, Gram&aacute;tica and Callejero &mdash; that level up on their own from what you already do (mastered cards, dialogues and stories, shadowing reps, conjugation rounds, and slang learned). Aim to push all five to level 5."],
  ["Install it like a real app", "\xD3RALE is now a PWA (progressive web app). Opened from a web address \u2014 GitHub Pages once published, or locally with <i>npx serve app</i> \u2014 Chrome and Edge show an <b>install icon</b> in the address bar. Installing gives you a standalone window, its own icon, and full offline operation via a version-aware cache (updates arrive automatically when the app version changes).<br><br>Nothing is required, though: double-clicking <i>orale.html</i> from disk works exactly as it always has, and your progress stays in whichever browser profile you use. One caveat \u2014 the installed app and the double-clicked file count as different origins, so keep using one or move progress across with <b>Exportar/Importar datos</b> in \u2699 Ajustes."],
  ["Your first week, concretely", "Day 1 (today): finish this tutorial, then <b>Estudiar \u2192 Aprender nuevas</b> and do your first 15 cards. Open the C\xF3dice, read Week 1, and start Language Transfer track 1 from the link.<br><br>Daily: clear the 4 missions (15 reviews, 1 game, 1 shadow rep, 1 conjugation round). Sunday: take the Week 1 exam in the C\xF3dice.<br><br>That is the whole system. One hour a day, honestly graded, spoken out loud. Anselmo \u2014 the scribe who comments from the parchment note \u2014 will keep you company. \xA1V\xE1monos!"]
];
let TUTI = 0;
function openTutorial() {
  TUTI = 0;
  tutPage();
}
function tutPage() {
  const last = TUTI === TUT.length - 1;
  modal('<div class="q-meta"><span>TUTORIAL</span><span>' + (TUTI + 1) + " / " + TUT.length + "</span></div><h3>" + TUT[TUTI][0] + '</h3><p class="muted" style="font-size:.88rem;line-height:1.6">' + TUT[TUTI][1] + '</p><div class="grid2" style="margin-top:16px"><button class="btn ghost" ' + (TUTI === 0 ? "disabled" : "") + ' onclick="TUTI--;tutPage()">Back</button><button class="btn" onclick="' + (last ? "tutDone()" : "TUTI++;tutPage()") + '">' + (last ? "Start learning" : "Next") + "</button></div>" + (last ? "" : '<button class="btn sm ghost wide" style="margin-top:8px" onclick="tutDone()">Skip tutorial</button>'));
}
function tutDone() {
  if (!S.tut) {
    S.tut = true;
    addXP(25);
    toast("+25 XP \xB7 Tutorial complete");
  }
  S.tut = true;
  save();
  closeModal();
  go("panel");
}
function pwaInit() {
  if (!("serviceWorker" in navigator)) return false;
  if (typeof location === "undefined" || location.protocol !== "https:" && location.protocol !== "http:") return false;
  navigator.serviceWorker.register("sw.js?v=" + APP_VERSION).catch(() => {
  });
  return true;
}
/*! INIT */
setInterval(() => {
  if (document.visibilityState === "visible") {
    day().min += 0.5;
    save();
  }
}, 3e4);
document.addEventListener("keydown", (e) => {
  var fc = document.getElementById("fc");
  if (!fc) return;
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    fc.classList.toggle("flip");
  } else if (e.key >= "1" && e.key <= "4") {
    ans(+e.key - 1);
  }
});
pwaInit();
persistStorage();
document.querySelector("#btn-help").addEventListener("click", openTutorial);
renderHeader();
go("panel");
if (!S.tut) {
  setTimeout(openTutorial, 500);
} else {
  setTimeout(() => {
    buddy(pick(AN.greet));
  }, 900);
}
if (Math.random() < 0.3) setTimeout(() => memoryRaid(false), 4e3);
</script>
