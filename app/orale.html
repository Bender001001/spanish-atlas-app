<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ÓRALE — The Mexican Spanish Codex</title>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#10141c; --ink2:#181e29; --ink3:#222a38; --line:#2e3746;
  --bone:#e9e4d8; --dim:#8b94a6; --faint:#5a6375;
  --rosa:#e4007c; --mari:#f2a33c; --tala:#3e8fb0; --lima:#8fbf4d; --rojo:#e05252;
  --parch:#f1e7d0; --parch2:#e7d9ba; --sepia:#4a3a22; --sepia2:#7a6440;
  --ac:var(--mari);
  --ff-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-codex:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ff-mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--ink);color:var(--bone);font-family:var(--ff-body);min-height:100vh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--tala);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--rosa);color:#fff}
:focus-visible{outline:2px solid var(--mari);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* zone accents */
body[data-zone="panel"]{--ac:var(--mari)}
body[data-zone="learn"]{--ac:var(--tala)}
body[data-zone="arena"]{--ac:var(--rosa)}
body[data-zone="codex"]{--ac:var(--sepia2)}
body[data-zone="cantina"]{--ac:#d98e4a}

/* ============ SHELL ============ */
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--ink) 75%,transparent);padding:14px 16px 10px}
.hd-row{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--ff-codex);font-weight:700;font-size:1.15rem;letter-spacing:.06em;color:var(--mari)}
.brand em{font-style:normal;color:var(--rosa)}
.hd-stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.78rem;font-family:var(--ff-mono);display:flex;gap:5px;align-items:center;white-space:nowrap}
.pill b{color:var(--mari)}
.pill.streak b{color:var(--rosa)}
.xp-wrap{margin-top:9px}
.xp-meta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);font-family:var(--ff-mono);margin-bottom:4px}
.xp-meta b{color:var(--bone)}
.xp-bar{height:7px;background:var(--ink3);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--mari),var(--rosa));border-radius:99px;transition:width .5s ease}
main{flex:1;padding:6px 16px 96px}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--ink2);border-top:1px solid var(--line);display:flex;max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:.66rem;letter-spacing:.04em;transition:color .15s}
nav button .ico{font-size:1.15rem;line-height:1}
nav button.on{color:var(--ac)}
nav button.on .ico{transform:translateY(-1px)}

/* ============ COMMON ============ */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:.98rem;margin-bottom:8px;font-family:var(--ff-codex);letter-spacing:.03em}
h2.sect{font-family:var(--ff-codex);font-size:1.35rem;margin:14px 0 12px;letter-spacing:.03em}
h2.sect small{display:block;font-family:var(--ff-mono);font-size:.68rem;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#0e0d0b;font-weight:700;border-radius:11px;padding:11px 18px;font-size:.92rem;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--ink3);color:var(--bone);border:1px solid var(--line);font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:7px 13px;font-size:.8rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;font-family:var(--ff-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;background:var(--ink3);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 8px}
.muted{color:var(--dim);font-size:.85rem;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.es{font-family:var(--ff-codex)}

/* ============ PANEL ============ */
.hero-greet{font-family:var(--ff-codex);font-size:1.5rem;line-height:1.25;margin:10px 0 2px}
.hero-greet b{color:var(--mari)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat .n{font-family:var(--ff-mono);font-size:1.35rem;font-weight:700;color:var(--ac)}
.stat .l{font-size:.66rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.quest{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.quest .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.quest.done .chk{background:var(--lima);border-color:var(--lima);color:#0e0d0b}
.quest.done .qt{text-decoration:line-through;color:var(--faint)}
.qt{font-size:.9rem;flex:1}
.qxp{font-family:var(--ff-mono);font-size:.72rem;color:var(--mari)}
.bar-row{margin:9px 0}
.bar-row .bl{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px}
.bar-row .bl b{font-family:var(--ff-mono);color:var(--dim);font-weight:400}
.bar{height:8px;background:var(--ink3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
canvas.chart{width:100%;height:130px;display:block}
/* analytics v2 */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.hm .cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--ff-mono);font-size:.6rem;color:var(--dim)}
.hm .cell b{font-size:.74rem;color:var(--bone)}
.hm .cell.lk{opacity:.35}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.68rem;color:var(--dim);font-family:var(--ff-mono);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* ============ FLASHCARDS ============ */
.fc-stage{perspective:1100px;margin:14px 0}
.fc{position:relative;min-height:250px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,1.4,.6,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--ink2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.fc-face.back{transform:rotateY(180deg);border-color:var(--tala)}
.fc-word{font-family:var(--ff-codex);font-size:2rem;line-height:1.2}
.fc-sub{color:var(--dim);font-size:.85rem}
.fc-hint{position:absolute;bottom:12px;font-size:.68rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.srs-btns button{padding:12px 4px;border-radius:11px;font-weight:700;font-size:.82rem;border:1px solid var(--line);background:var(--ink3)}
.srs-btns .b0{color:var(--rojo)} .srs-btns .b1{color:var(--mari)}
.srs-btns .b2{color:var(--tala)} .srs-btns .b3{color:var(--lima)}
.srs-btns button small{display:block;font-weight:400;font-size:.62rem;color:var(--faint);font-family:var(--ff-mono);margin-top:2px}
.speak-ico{background:var(--ink3);border:1px solid var(--line);border-radius:99px;width:42px;height:42px;font-size:1.1rem;color:var(--tala)}

/* ============ QUIZ / GAMES ============ */
.opt{display:block;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;font-size:.95rem;transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--ac)}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--lima);background:rgba(143,191,77,.12)}
.opt.wrong{border-color:var(--rojo);background:rgba(224,82,82,.12)}
.q-word{font-family:var(--ff-codex);font-size:1.7rem;text-align:center;margin:16px 0}
.q-meta{display:flex;justify-content:space-between;font-family:var(--ff-mono);font-size:.75rem;color:var(--dim);margin-bottom:8px}
.timerbar{height:5px;background:var(--ink3);border-radius:99px;overflow:hidden;margin-bottom:14px}
.timerbar i{display:block;height:100%;background:var(--rosa);transition:width .2s linear}
.game-tile{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:border-color .15s,transform .1s}
.game-tile:active{transform:scale(.98)}
.game-tile:hover{border-color:var(--rosa)}
.game-tile .gt{font-family:var(--ff-codex);font-size:1.02rem;color:var(--rosa);margin-bottom:4px}
.game-tile .gd{font-size:.76rem;color:var(--dim);line-height:1.4}
.game-tile .gx{font-family:var(--ff-mono);font-size:.66rem;color:var(--mari);margin-top:7px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:44px}
.tile{background:var(--ink3);border:1px solid var(--tala);border-radius:9px;padding:9px 13px;font-family:var(--ff-codex);font-size:.95rem}
.tile:disabled{opacity:.25}
.build-out{min-height:52px;border:1px dashed var(--line);border-radius:11px;padding:9px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.bigscore{font-family:var(--ff-mono);font-size:2.6rem;text-align:center;color:var(--ac);margin:10px 0}

/* ============ CODEX (parchment zone) ============ */
.codex{background:var(--parch);color:var(--sepia);border-radius:16px;padding:20px 18px;font-family:var(--ff-codex);box-shadow:inset 0 0 60px rgba(122,100,64,.25);border:1px solid var(--parch2)}
.codex h2{font-size:1.4rem;letter-spacing:.04em;border-bottom:2px solid var(--sepia2);padding-bottom:6px;margin-bottom:12px}
.codex h2::first-letter{font-size:1.9rem;color:#8c2f1b}
.codex .phase{border:1px solid var(--parch2);border-radius:11px;margin-bottom:10px;background:rgba(255,255,255,.35);overflow:hidden}
.codex .phase>button{width:100%;text-align:left;padding:13px 14px;font-family:var(--ff-codex);font-size:1rem;font-weight:700;color:var(--sepia);display:flex;justify-content:space-between;align-items:center}
.codex .phase .ph-body{padding:0 14px 12px;display:none}
.codex .phase.open .ph-body{display:block}
.wk{border-top:1px dotted var(--sepia2);padding:11px 0}
.wk .wk-t{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk .wk-t .tag{background:transparent;border-color:var(--sepia2);color:var(--sepia2)}
.wk p{font-size:.87rem;line-height:1.55;margin:6px 0}
.wk .mission{font-style:italic;color:#8c2f1b}
.wk ul{margin:4px 0 6px 18px;font-size:.85rem}
.wk a{color:#1f5b7a;font-weight:600}
.wk .btn{background:var(--sepia);color:var(--parch)}
.wk.done .wk-t::after{content:"✓ superada";font-size:.7rem;color:#3e7a3e;font-family:var(--ff-mono)}
.marginalia{border-left:3px solid #8c2f1b;background:rgba(140,47,27,.07);padding:9px 12px;font-style:italic;font-size:.86rem;border-radius:0 9px 9px 0;margin:10px 0}

/* ============ CANTINA ============ */
.slang-card{background:linear-gradient(160deg,#241a12,#1a1410);border:1px solid #4a3520;border-radius:var(--r);padding:14px;margin-bottom:10px}
.slang-card .sw{font-family:var(--ff-codex);font-size:1.2rem;color:#e8b04a}
.slang-card .sm{font-size:.85rem;color:var(--bone);margin:4px 0}
.slang-card .sx{font-size:.8rem;color:var(--dim);font-style:italic}
.ff-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.8rem;padding:9px 0;border-bottom:1px solid var(--line)}
.ff-row b{color:#d98e4a;font-family:var(--ff-codex);font-size:.92rem}
.ff-row .no{color:var(--rojo)} .ff-row .si{color:var(--lima)}
.fact{border-left:3px solid #d98e4a;padding:8px 12px;margin:10px 0;font-size:.87rem;line-height:1.55;color:var(--bone)}
.chip{display:inline-block;background:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:3px;font-family:var(--ff-codex);font-size:.85rem}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.subtabs button{white-space:nowrap;background:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.78rem;color:var(--dim)}
.subtabs button.on{background:var(--ac);color:#0e0d0b;border-color:var(--ac);font-weight:700}

/* ============ BUDDY ============ */
#buddy{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 28px));z-index:55;background:var(--parch);color:var(--sepia);border-radius:13px;padding:11px 40px 11px 14px;font-family:var(--ff-codex);font-size:.88rem;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.5);border:1px solid var(--parch2);display:none;font-style:italic}
#buddy.show{display:block;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
#buddy::before{content:"ANSELMO ✒";position:absolute;top:-9px;left:12px;background:#8c2f1b;color:var(--parch);font-style:normal;font-family:var(--ff-mono);font-size:.58rem;letter-spacing:.14em;padding:2px 8px;border-radius:6px}
#buddy .bx{position:absolute;top:6px;right:8px;color:var(--sepia2);font-size:1rem;padding:4px}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.96)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(8,10,15,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto}
.modal h3{font-family:var(--ff-codex);font-size:1.2rem;margin-bottom:10px}
.chest{text-align:center;padding:14px 0}
.chest .cico{font-size:3rem;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.chest .cre{font-family:var(--ff-codex);font-size:1.1rem;color:var(--mari);margin-top:8px}
select,input[type=text]{width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:10px;color:var(--bone);padding:10px 12px;font-size:.9rem;font-family:inherit}
label.fl{display:block;font-size:.75rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 5px;font-family:var(--ff-mono)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink3);border:1px solid var(--mari);color:var(--bone);border-radius:11px;padding:10px 18px;z-index:200;font-size:.85rem;animation:pop .3s;font-family:var(--ff-mono)}
@media(max-width:420px){.statgrid{gap:7px}.grid2{grid-template-columns:1fr}}
@media(min-width:600px){main{padding:6px 24px 96px}.card{padding:20px}.statgrid{gap:14px}}
/* tab-switch fade (S13) */
#view.fade{animation:viewfade .2s ease}
@keyframes viewfade{from{opacity:0}to{opacity:1}}
/* level-up glow (S13) */
.xp-fill.leveling{box-shadow:0 0 12px var(--mari)}
/* TTS speaking indicator (S13) */
body.tts .speak-ico{animation:ttspulse 1s ease infinite;border-color:var(--tala)}
@keyframes ttspulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.story-para{font-family:var(--ff-codex);font-size:1.06rem;line-height:1.75;color:var(--bone)}

.sktree{display:flex;flex-direction:column;gap:10px}
.sktree .branch{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sktree .br-h{display:flex;align-items:center;gap:10px}
.sktree .br-ico{font-size:1.2rem;color:var(--rosa)}
.sktree .br-name{font-family:var(--ff-codex);font-size:1rem;flex:1}
.sktree .br-lv{font-family:var(--ff-mono);font-size:.72rem;color:var(--mari)}
.sktree .nodes{display:flex;gap:8px;margin:9px 0 6px}
.sktree .node{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--ink3)}
.sktree .node.on{background:var(--rosa);border-color:var(--rosa);box-shadow:0 0 8px rgba(228,0,124,.5)}
.sktree .br-sub{font-size:.76rem;line-height:1.4}
</style>
</head>
<body data-zone="panel">
<div id="app">
  <header>
    <div class="hd-row">
      <div class="brand">¡ÓRA<em>LE</em>!</div>
      <div class="hd-stats">
        <div class="pill streak" id="pill-streak" title="Racha (streak)">✦ <b>0</b></div>
        <div class="pill" id="pill-pesos" title="Pesos">$ <b>0</b></div>
        <button class="pill" id="btn-help" title="Tutorial (English)">?</button>
        <button class="pill" id="btn-settings" title="Ajustes">⚙</button>
      </div>
    </div>
    <div class="xp-wrap">
      <div class="xp-meta"><span id="xp-rank">Nivel 1 · Peregrino</span><b id="xp-num" aria-live="polite">0 XP</b></div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
  </header>
  <main id="view" role="main"></main>
  <nav role="navigation" aria-label="Navegación principal">
    <button data-v="panel" class="on" aria-label="Panel"><span class="ico">◆</span>Panel</button>
    <button data-v="learn" aria-label="Estudiar"><span class="ico">✎</span>Estudiar</button>
    <button data-v="arena" aria-label="Arena"><span class="ico">⚔</span>Arena</button>
    <button data-v="codex" aria-label="Códice"><span class="ico">❧</span>Códice</button>
    <button data-v="cantina" aria-label="Cantina"><span class="ico">♪</span>Cantina</button>
  </nav>
  <div id="buddy" role="status"><span id="buddy-txt"></span><button class="bx" onclick="hideBuddy()">×</button></div>
  <div id="modal-root"></div>
</div>
<script>
"use strict";
/* ================= DATA: CURRICULUM ================= */
const PHASES=[
 [1,"Supervivencia","Weeks 1-4 · Sound system, survival phrases, the verb engine starts"],
 [2,"Vida Diaria","Weeks 5-8 · Present tense mastery, food, family, daily routine"],
 [3,"En la Calle","Weeks 9-13 · Directions, restaurants, shopping, past tense unlocked"],
 [4,"Conversación","Weeks 14-18 · Opinions, feelings, storytelling, future plans"],
 [5,"Español Callejero","Weeks 19-22 · Slang, idioms, humor, the subjunctive survival kit"],
 [6,"Pulido Final","Weeks 23-26 · Speed, narration, debate, final exam"]];
const LT="https://www.languagetransfer.org";
const DS="https://www.dreamingspanish.com";
function yt(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q)}
const W=[
{n:1,ph:1,t:"Sounds & Survival",g:"Spanish is phonetic: 5 pure vowels (a e i o u), never lazy like English. Rolled/tapped R, ñ, silent H, LL sounds like Y in Mexico. Stress rules: words ending in vowel/n/s stress the 2nd-to-last syllable; accents override.",m:"Record yourself saying 10 greetings out loud. Say hola, buenos días, ¿cómo estás? to a mirror without reading.",r:[["Language Transfer — start Track 1 (your Michel Thomas engine)",LT],["Butterfly Spanish: pronunciation",yt("butterfly spanish pronunciation vowels")]]},
{n:2,ph:1,t:"To Be or To Be (ser vs estar)",g:"Two verbs for 'to be'. SER = identity/permanent (soy Mateo, soy de India). ESTAR = state/location (estoy cansado, estoy en Houston). Doctor for who you are, Location/Emotion for estar.",m:"Say 8 true sentences about yourself with soy/estoy. No writing.",r:[["Language Transfer tracks 5-12",LT],["Ser vs estar explained",yt("ser vs estar butterfly spanish")]]},
{n:3,ph:1,t:"Numbers, Time & Courtesy",g:"Numbers 1-100, telling time (son las tres), days, months. Courtesy oil: por favor, gracias, con permiso, disculpe, ¿mande? (very Mexican way to say 'what?/pardon?').",m:"Say your phone number, birthday and daily schedule out loud in Spanish.",r:[["Numbers drill",yt("spanish numbers 1-100 practice listening")],["Dreaming Spanish superbeginner videos — start daily habit",DS]]},
{n:4,ph:1,t:"The Question Machine",g:"Question words: qué, quién, cuándo, dónde, por qué, cómo, cuánto, cuál. Intonation makes questions — no word-order gymnastics needed. Checkpoint week: Phase 1 test.",m:"Ask 15 questions out loud about an imaginary stranger. Interrogate them.",r:[["Question words",yt("spanish question words explained")],["Easy Spanish street interviews (Mexico City)","https://www.youtube.com/@EasySpanish"]]},
{n:5,ph:2,t:"The Big 5 Verbs",g:"Present tense of the workhorses: tener (have), ir (go), querer (want), poder (can), hacer (do/make). IR + A + infinitive = instant future: voy a comer = I'm going to eat. This one trick unlocks the future tense months early.",m:"Narrate tomorrow's plan out loud using only 'voy a...' — 10 sentences.",r:[["Language Transfer tracks 13-25",LT],["Top Spanish verbs",yt("most common spanish verbs present tense")]]},
{n:6,ph:2,t:"Food & the Taco Protocol",g:"Ordering: me da..., quisiera..., para llevar (to go), la cuenta por favor. Mexican menu literacy: antojitos, guisados, salsas. Gustar logic: me gusta = 'it pleases me' (the thing is the subject).",m:"Order a full imaginary meal at a taquería out loud, including a complaint and the bill.",r:[["Ordering food in Mexico",yt("how to order tacos in spanish mexico")],["Spanish and Go — Mexico focused","https://www.youtube.com/@SpanishandGo"]]},
{n:7,ph:2,t:"Family, People & Descriptions",g:"Family tree vocab, adjectives and agreement (alto/alta), possessives (mi, tu, su). Physical + personality descriptions. Diminutives: -ito/-ita make everything Mexican (ahorita, cafecito, momentito).",m:"Describe 5 family members out loud: appearance, personality, what they do.",r:[["Diminutives in Mexican Spanish",yt("mexican spanish diminutives ito ita")],["Dreaming Spanish — beginner level now",DS]]},
{n:8,ph:2,t:"Daily Routine & Reflexives",g:"Reflexive verbs: me levanto, me baño, me voy. Time connectors: primero, luego, después, antes de, por fin. Phase 2 checkpoint test.",m:"Narrate your entire day out loud from waking to sleeping, 2 minutes minimum.",r:[["Reflexive verbs",yt("spanish reflexive verbs daily routine")],["Language Transfer tracks 26-40",LT]]},
{n:9,ph:3,t:"Getting Around",g:"Directions: derecha, izquierda, derecho (straight — beware, sounds like right!), cuadra (block). Transport, Uber/taxi talk. Estar + location deep dive, hay = there is/are.",m:"Give someone directions from your house to your favorite restaurant, out loud.",r:[["Directions in Spanish",yt("asking directions in spanish mexico")],["No Hay Tos podcast — Mexican Spanish, start now",yt("no hay tos podcast beginner")]]},
{n:10,ph:3,t:"Shopping & Haggling",g:"Prices, sizes, colors. ¿Cuánto cuesta? ¿Tiene en otro color? Está muy caro. Demonstratives: este, ese, aquel. Mexican market culture: el regateo (haggling) etiquette.",m:"Roleplay buying shoes and haggling — play both parts out loud.",r:[["Shopping vocabulary",yt("shopping in spanish market conversation")],["Easy Spanish: markets",yt("easy spanish mercado")]]},
{n:11,ph:3,t:"The Past Unlocked I (Preterite)",g:"Preterite = completed actions: hablé, comí, viví. The killers: fui (I went/was), tuve, hice, dije. Story spine: primero pasó X, luego Y, al final Z.",m:"Tell what you did yesterday, out loud, 90 seconds, only past tense.",r:[["Language Transfer — past tense tracks",LT],["Preterite explained",yt("spanish preterite tense explained simply")]]},
{n:12,ph:3,t:"The Past Unlocked II (Imperfect)",g:"Imperfect = background/used to: hablaba, comía, era, estaba. Preterite is the photo, imperfect is the video. Cuando era niño... (when I was a kid) — your story-telling superpower.",m:"Describe your childhood for 2 minutes out loud: where you lived, what you used to do.",r:[["Preterite vs imperfect",yt("preterite vs imperfect spanish story")],["Dreaming Spanish — intermediate stories",DS]]},
{n:13,ph:3,t:"Health, Body & Emergencies",g:"Me duele... (hurts), body parts, pharmacy talk, emergencies. Tener idioms: tengo hambre/sed/sueño/prisa/miedo. Phase 3 checkpoint test.",m:"Explain 3 ailments to an imaginary pharmacist and understand their advice.",r:[["At the doctor in Spanish",yt("spanish doctor pharmacy conversation")],["Tener expressions",yt("tener expressions spanish")]]},
{n:14,ph:4,t:"Opinions & Arguments",g:"Creo que, pienso que, me parece que, en mi opinión, la neta (honestly - MX). Agreeing/disagreeing: tienes razón, no estoy de acuerdo, depende. Comparatives: más que, menos que, mejor, peor.",m:"Argue out loud for 2 minutes: tacos vs pizza. Take both sides.",r:[["Giving opinions",yt("give opinions in spanish phrases")],["Easy Spanish opinion interviews",yt("easy spanish opinions street interview")]]},
{n:15,ph:4,t:"Feelings & Small Talk",g:"Emotion vocabulary beyond bien/mal. Small talk weather, weekend, family. The Mexican art of not saying no directly: ahorita, luego vemos, déjame ver.",m:"Do a full 3-minute imaginary small-talk exchange with a neighbor, both roles.",r:[["Small talk phrases",yt("spanish small talk phrases native")],["No Hay Tos — pick any episode",yt("no hay tos podcast")]]},
{n:16,ph:4,t:"Phone, Plans & Invitations",g:"Phone talk: bueno (Mexican phone hello), ¿de parte de quién? Making/changing/cancelling plans. Quedamos a las 8. Direct object pronouns: lo, la, los, las (lo compro = I buy it).",m:"Leave 3 voicemails out loud: invite, reschedule, cancel with excuse.",r:[["Phone conversations",yt("spanish phone conversation practice")],["Object pronouns",yt("direct object pronouns spanish explained")]]},
{n:17,ph:4,t:"Work & Life Story",g:"Talking about your job without jargon: me dedico a..., trabajo en ventas. Your life arc: nací en, crecí en, me mudé a, llevo X años en. Present perfect: he vivido, he trabajado.",m:"Deliver your 2-minute life story out loud, smooth, no notes. Record it — this is your benchmark tape.",r:[["Talk about your job",yt("talk about your job in spanish")],["Dreaming Spanish intermediate",DS]]},
{n:18,ph:4,t:"Storytelling Bootcamp",g:"Fillers that buy time like a native: pues, este..., o sea, fíjate que, ¿sabes qué? Sequencers, reported speech light: me dijo que... Phase 4 checkpoint test.",m:"Tell a funny story that happened to you, 2 minutes, with fillers and drama.",r:[["Spanish filler words",yt("spanish filler words muletillas mexican")],["Storytelling in Spanish",yt("tell stories in spanish past tenses")]]},
{n:19,ph:5,t:"Mexican Slang Core",g:"The essentials: güey, órale, ándale, no manches, qué padre, chido, neta, aguas, chamba, sale. Register: when slang builds rapport vs when it backfires. The many jobs of madre in Mexican Spanish.",m:"Re-tell week 18's story, now seasoned with 5 slang words, naturally.",r:[["Mexican slang 101",yt("mexican slang words guey orale explained")],["Qué Onda: slang",yt("mexican spanish slang street")]]},
{n:20,ph:5,t:"Idioms & Figures of Speech",g:"Echar la mano (help out), estar crudo (hungover), me vale (I don't care), sacar de onda (throw off). Sayings: más vale tarde que nunca, camarón que se duerme...",m:"Use 6 idioms in improvised sentences out loud, then explain each in Spanish.",r:[["Mexican idioms",yt("mexican spanish idioms dichos explained")],["Dichos y refranes",yt("dichos mexicanos famosos significado")]]},
{n:21,ph:5,t:"Subjunctive Survival Kit",g:"Don't master it — pattern-match it. Quiero que vengas, espero que estés bien, ojalá (que) llueva, cuando llegues. Learn 12 frozen frames that cover 90% of spoken use.",m:"Make 10 wishes and hopes out loud using ojalá and espero que.",r:[["Subjunctive shortcuts",yt("spanish subjunctive triggers easy")],["Language Transfer — subjunctive tracks",LT]]},
{n:22,ph:5,t:"Humor, Albures & Culture",g:"Mexican humor: double meanings (albures — recognize, don't attempt yet), sarcasm markers, teasing culture (carrilla). Regional flavors: norteño vs chilango vs costeño. Phase 5 checkpoint test.",m:"Watch a Mexican comedy clip and re-tell the joke out loud in Spanish.",r:[["Understanding albures",yt("que son los albures mexicanos explicacion")],["Franco Escamilla stand-up clips",yt("franco escamilla clips subtitulos")]]},
{n:23,ph:6,t:"Speed & Ear Training",g:"Native-speed listening: linked speech (¿on'tá? = ¿dónde está?), dropped S in coastal accents. Shadow at 1.0x then 1.25x. Your ear does the heavy lifting from here.",m:"Shadow a 60-second native clip until you match rhythm. 5 reps daily.",r:[["Fast Spanish listening",yt("understand fast spoken spanish mexican")],["No Hay Tos at natural speed",yt("no hay tos natural speed")]]},
{n:24,ph:6,t:"Debate & Depth",g:"Hold positions: por un lado... por otro lado, sin embargo, aunque, a pesar de. Hypotheticals: si tuviera... haría (if I had... I would).",m:"Debate yourself out loud for 3 minutes: living in Mexico vs USA.",r:[["Connectors for fluency",yt("spanish connectors advanced speaking")],["Conditional explained",yt("spanish conditional si clauses")]]},
{n:25,ph:6,t:"Real Humans Protocol",g:"Deploy: free language exchanges (ConversationExchange.com, Tandem/HelloTalk apps), local taquerías, Mexican coworkers. Repair strategies: ¿cómo se dice...?, ¿me lo repites más despacio?",m:"Have one real 10-minute conversation with a native speaker. Non-negotiable.",r:[["ConversationExchange (free partners)","https://www.conversationexchange.com"],["How to survive first conversation",yt("first spanish conversation tips")]]},
{n:26,ph:6,t:"El Examen Final",g:"Final exam in-app + real-world proof: record your 3-minute life story again and compare with week 17's tape. That delta is your certificate.",m:"Final boss: 15-minute conversation with a native. Then claim your rank.",r:[["Self-assess with CEFR",yt("cefr b1 spanish speaking sample")],["Keep going: Dreaming Spanish advanced",DS]]}
];

{wk:4,ph:1,t:"El primer día de Mateo",
 note:"Chapter I. A stranger arrives, and the street tests his tongue at once. Present tense, survival words.",
 quest:"Misión: acompaña a Mateo en su primer día. Escucha cada párrafo y descubre a quién conoce y a qué hora.",
 paras:[
 "¡Hola! Me llamo Mateo. Soy de la India y ahora estoy en una ciudad de México. Hoy es mi primer día aquí y, la verdad, estoy muy nervioso. También estoy contento, porque todo es nuevo para mí. No tengo amigos aquí todavía, pero quiero tener muchos amigos. Quiero aprender español y quiero hablar como la gente de aquí.",
 "En la calle, una señora muy amable me dice: «Buenos días, joven. ¿Cómo estás?». Yo digo: «Buenos días, señora. Estoy bien, gracias. ¿Y usted?». «Muy bien, gracias», dice ella. «¿De dónde eres?». «Soy de la India», digo yo. «¡Ah, qué lejos! Mucho gusto, joven», dice ella con una sonrisa.",
 "La señora se llama Lupita. Lupita es simpática y platica mucho. «¿Qué hora es?», me dice. En mi reloj son las diez de la mañana. «Todavía es temprano», dice Lupita. «¿Tienes tiempo para un café?». «Sí, claro que sí», digo yo. «Tengo todo el día. No tengo trabajo hoy». «¡Perfecto! Vamos», dice ella.",
 "Nosotros vamos a un café pequeño y bonito. Yo quiero aprender y Lupita quiere ayudar. «¿Por qué estás aquí en México?», me dice ella. «Quiero trabajar y también quiero aprender el idioma», digo yo. «¡Qué bien! Mira, aquí en México somos muy amables», dice Lupita. «Poco a poco vas a hablar muy bien. No es tan difícil».",
 "Mi primer día no es fácil, pero ya no estoy tan nervioso. Ahora estoy feliz. En una hora, ya tengo una amiga nueva: Lupita. «Mañana es otro día», dice ella. «Y mañana vas a aprender más palabras». «Muchas gracias por todo, señora Lupita», digo yo. «¡Qué buena onda es la gente aquí!». Hoy, en mi primer día, ya estoy un poco en casa. ¡Órale, qué buen comienzo!"
 ],
 mcqs:[
 {q:"¿De dónde es Mateo?",o:["De México","De la India","De España","De Houston"],a:1},
 {q:"¿Cómo está Mateo en su primer día?",o:["Nervioso y contento","Enojado","Cansado y triste","Enfermo"],a:0},
 {q:"¿Cómo se llama la señora amable?",o:["Ana","Sofía","Lupita","Carmen"],a:2},

{wk:8,ph:2,t:"La comida de los domingos",
 note:"Chapter II. Routine, family and a Sunday feast. Present tense and the ir+a future.",
 quest:"Misión: sigue el día de Mateo, de la mañana a la comida familiar. ¿Qué van a comer y qué van a hacer?",
 paras:[
 "Ahora Mateo ya tiene una rutina. Todos los días quiere levantarse temprano, a las seis de la mañana. Primero va a bañarse, y después va a comer pan con café. «El desayuno es muy necesario», dice siempre Lupita. «Sin desayuno no puedes estudiar bien». Mateo sabe que ella tiene razón.",
 "De lunes a viernes, Mateo va a la escuela para estudiar español. En la clase hace muchas cosas: escucha, habla y practica. Hace preguntas todo el tiempo, porque quiere aprender rápido. A veces está muy cansado, pero nunca va a dejar de practicar. «Voy a hablar bien», dice, «aunque me cueste».",
 "Hoy es domingo y Mateo va a comer con la familia de Lupita. La madre de Lupita hace pollo con arroz y frijoles. También hay tortillas, salsa picante y aguacate. «¡Qué sabroso!», dice Mateo. «Muchas gracias, señora. Todo está muy rico». La madre está feliz. «Come más, joven, hay mucha comida», le dice ella.",
 "El padre de Lupita es muy simpático y también platica mucho. «¿Y qué vas a hacer mañana?», le dice a Mateo. «Mañana voy a descansar un poco y luego voy a estudiar», dice Mateo. «Y el domingo que viene vamos a jugar fútbol», dice el hermano de Lupita. «¡Va! Me gusta la idea», dice Mateo, muy contento.",
 "En la noche, Mateo está feliz y un poco cansado. Ahora tiene amigos, tiene comida sabrosa y tiene una familia mexicana. «Poco a poco voy a hablar como la gente de aquí», piensa. «Voy a lograr mi meta». Y va a dormir temprano, porque mañana es lunes y va a ser otro día de trabajo. Mateo ya no está solo: México ya es un poco su casa."
 ],
 mcqs:[
 {q:"¿A qué hora quiere levantarse Mateo?",o:["A las diez","A las seis","A las ocho","A mediodía"],a:1},
 {q:"¿Para qué va Mateo a la escuela?",o:["Para trabajar","Para comer","Para estudiar español","Para dormir"],a:2},
 {q:"¿Qué día come con la familia de Lupita?",o:["El lunes","El sábado","El domingo","El viernes"],a:2},
 {q:"¿Qué hace de comer la madre de Lupita?",o:["Pollo con arroz y frijoles","Pescado","Torta y café","Solo fruta"],a:0},

{wk:13,ph:3,t:"Perdido en la ciudad",
 note:"Chapter III. The past tense arrives, and so does trouble: Mateo gets lost, haggles, and lands at the pharmacy.",
 quest:"Misión: reconstruye lo que le pasó a Mateo ayer, paso a paso. ¿Cómo terminó su aventura?",
 paras:[
 "Ayer Mateo tuvo una gran aventura. Quiso ir al mercado, pero se perdió en la ciudad. Caminó mucho: primero a la derecha, luego a la izquierda, y al final no supo dónde estaba. Todo estaba muy lejos y no vio ningún letrero. «¿Dónde está el mercado?», dijo, un poco nervioso.",
 "Por fin, un señor muy amable lo ayudó. «Está cerca, joven», dijo el señor. «Camine derecho dos cuadras y luego a la izquierda, en la esquina del semáforo». Mateo caminó rápido y por fin llegó. ¡Qué grande y qué bonito estaba el mercado! Había comida, ropa y mucha gente por todos lados.",
 "En el mercado, Mateo vio unos zapatos muy bonitos. «¿Cuánto cuesta?», dijo. «Doscientos pesos», dijo el señor de la tienda. «Uy, es mucho, está muy caro», dijo Mateo. Los dos hablaron un rato y, al final, Mateo pagó ciento cincuenta. «El regateo es un arte», pensó, muy contento con su ganga. Aprendió algo nuevo ese día.",
 "Pero, de repente, a Mateo le empezó a doler el estómago. La comida picante fue demasiado para él. Caminó a una farmacia cerca del mercado. «Me duele mucho el estómago», dijo. La doctora fue muy amable y le dio una medicina. «Tómela hoy y mañana va a estar bien, joven», dijo ella. «No coma tan picante».",
 "En la noche, Mateo ya estaba mejor. Habló con Lupita por teléfono y le contó todo: el señor amable, el mercado, los zapatos baratos y el dolor de estómago. Los dos hablaron y hablaron. «¡Ay, Mateo! Bienvenido a México», dijo ella, muy contenta. «Aquí cada día es una nueva historia». Mateo estaba cansado, pero feliz. Su aventura terminó bien."
 ],
 mcqs:[
 {q:"¿Qué quiso hacer Mateo ayer?",o:["Ir a la escuela","Ir al mercado","Ir al hospital","Ir al café"],a:1},
 {q:"¿Qué le pasó cuando caminó por la ciudad?",o:["Se perdió","Vio a Lupita","Compró un carro","Encontró trabajo"],a:0},
 {q:"¿Cuánto pagó Mateo por los zapatos?",o:["Doscientos pesos","Ciento cincuenta pesos","Cincuenta pesos","Nada"],a:1},
 {q:"¿Por qué fue Mateo a la farmacia?",o:["Le dolía la cabeza","Le dolía el estómago","Estaba cansado","Quería comprar salsa"],a:1},
 {q:"¿Qué hicieron Mateo y Lupita en la noche?",o:["Fueron al mercado","Hablaron de la aventura por teléfono","Comieron tacos","Estudiaron español"],a:1}

{wk:18,ph:4,t:"La gran decisión",
 note:"Chapter IV. Opinions, feelings and a life choice: Mateo weighs a job offer and tells his own story.",
 quest:"Misión: entiende la decisión de Mateo. ¿Qué le ofrecen, qué opina Lupita y qué decide al final?",
 paras:[
 "Después de un año, Mateo ya hablaba mucho mejor. Un día, su jefe le dijo algo muy importante. «Fíjate que tenemos un proyecto nuevo», le dijo. «Necesitamos a alguien bueno en ventas. ¿Quieres el trabajo? Es más dinero, pero también es más responsabilidad. Tú decides». Mateo no supo qué decir en ese momento.",
 "Esa noche, Mateo estaba emocionado, pero también nervioso. «No sé qué hacer», pensó. «Por un lado, quiero el ascenso y el mejor sueldo. Por otro lado, tengo un poco de miedo. ¿Voy a poder? ¿Y si me equivoco?». Pensó y pensó, y casi no pudo dormir en toda la noche. Era una decisión difícil.",
 "Al día siguiente, habló con Lupita, porque ella siempre le daba buenas ideas. «La verdad, creo que tú puedes», le dijo ella. «Tienes experiencia y trabajas mucho. En mi opinión, tienes que decir que sí. El miedo es normal, amigo. Todos tenemos miedo antes de algo nuevo. Pero tú eres fuerte».",
 "Mateo pensó en toda su historia. «Nací en la India, me mudé a México y aprendí un idioma nuevo. Si pude con todo eso, también puedo con esto». De repente, ya no tenía tanto miedo. Estaba más tranquilo y hasta un poco orgulloso. «Tienes razón, Lupita», dijo. «Gracias por escuchar. Siempre me ayudas mucho».",
 "Al otro día, Mateo fue con su jefe, muy seguro. «Sí, quiero el trabajo», le dijo. «Muchas gracias por la oportunidad. Voy a trabajar muy duro». Su jefe estaba muy contento. «Sabía que ibas a decir que sí», le dijo. «Bienvenido al equipo». Y así, con miedo pero con fuerza, Mateo empezó un nuevo capítulo de su historia."
 ],

{wk:22,ph:5,t:"La fiesta de la cuadra",
 note:"Chapter V. Slang, jokes and good vibes: Mateo learns the street has its own dictionary.",
 quest:"Misión: métete a la fiesta con Mateo. ¿Entiendes la jerga, el humor y los buenos deseos del barrio?",
 paras:[
 "El sábado, Mateo fue a una fiesta en la cuadra de Lupita. «¡Órale, ya llegaste!», le dijo un amigo. «Qué padre que viniste, güey». Mateo ya entendía la jerga y le contestó: «¡Claro que sí! No me la iba a perder, ¿cómo crees?». Todos se rieron. Ese Mateo ya hablaba como un chilango.",
 "Había mucha comida, música y muy buena onda. Un señor contó un chiste, pero Mateo no lo entendió bien. «Es un albur», le explicó Lupita. «Es un chiste con doble sentido, humor muy mexicano. No te preocupes, poco a poco lo vas a entender. A mí también me costó de niña».",
 "«Oye, ¿y tú de dónde eres?», le dijo una chica. «De la India, pero ya me siento medio mexicano», dijo Mateo. «¡No manches, qué chido!», dijo ella. «Hablas increíble, güey». Mateo estaba muy contento. La neta, ya no se sentía como un extranjero en la fiesta. Ahora era uno más del barrio.",
 "«Ojalá te quedes muchos años aquí», le dijo Lupita, ya tarde en la noche. «Ojalá», dijo Mateo con una sonrisa. «Aunque a veces echo de menos a mi familia, la verdad me siento en casa. Ustedes ya son mi familia también». «Ándale, ya te pusiste sentimental, güey», dijo ella, y los dos se rieron.",
 "La fiesta terminó muy tarde. Mateo caminó a su casa contento, con la música todavía en la cabeza. «Qué buena onda es la gente de aquí», pensó. Ya no era el chico nervioso del primer día. Ahora sabía la jerga, entendía los chistes y tenía muchos amigos. Ahora, de verdad, era un cuate más de la cuadra. ¡Qué chido!"
 ],
 mcqs:[
 {q:"¿Dónde fue la fiesta?",o:["En un café","En la cuadra de Lupita","En la escuela","En el mercado"],a:1},
 {q:"¿Qué es un «albur»?",o:["Una comida","Un baile","Un chiste con doble sentido","Un tipo de música"],a:2},
 {q:"¿Qué le dijo la chica cuando supo que Mateo hablaba bien?",o:["«No manches, qué chido»","«Qué caro»","«Ni modo»","«Está muy lejos»"],a:0},
 {q:"¿Qué le desea Lupita a Mateo (ojalá...)?",o:["Que se vaya pronto","Que se quede muchos años","Que trabaje más","Que cocine"],a:1},
 {q:"¿Cómo se siente Mateo al final de la fiesta?",o:["Como un extranjero","Nervioso y triste","Como un cuate del barrio","Enojado"],a:2}

{wk:26,ph:6,t:"Un nuevo capítulo",
 note:"Chapter VI. The finale. Two years on, Mateo looks back, weighs his future, and celebrates how far he has come.",
 quest:"Misión: llega al final del viaje de Mateo. ¿Qué decide sobre su futuro y qué aprendió del camino?",
 paras:[
 "Después de dos años, Mateo ya hablaba español casi como un mexicano. Un día pensó en todo su camino: el primer día nervioso, la señora amable del café, el mercado, el dolor de estómago, el nuevo trabajo y la gran fiesta de la cuadra. «Cuánto cambié», pensó, con una sonrisa. «Ya no soy el mismo chico de antes».",
 "Su familia de la India lo llamó por teléfono. «¿Cuándo vas a volver, hijo?», le dijo su madre. Mateo se quedó callado un rato. Por un lado, echaba de menos a su familia. Por otro lado, aquí ya tenía amigos, trabajo y una buena vida. Era una decisión muy difícil. No supo qué contestar en ese momento.",
 "Después habló con Lupita. «La verdad, no sé qué hacer», le dijo. «Los quiero mucho a todos ustedes, pero también quiero ver a mi familia en la India». Lupita lo escuchó con paciencia. «¿Y por qué no las dos cosas?», dijo ella. «Puedes ir a ver a tu familia y luego volver. México ya es tu casa también, amigo».",
 "Mateo entendió que no tenía que escoger para siempre. «Tienes toda la razón», dijo, más tranquilo. «Voy a ir a la India en el verano, voy a ver a mi familia, y luego voy a volver aquí. Lo mejor está por venir». Se sintió muy bien y muy agradecido. Por fin ya no tenía miedo del futuro.",
 "Esa noche, Mateo pensó en todo el camino. Ya no era el extranjero perdido del primer día. Aprendió un idioma nuevo, hizo muchos amigos y encontró una segunda casa. «Valió la pena», dijo en voz alta, muy contento. «Todo el esfuerzo valió la pena». Y con una gran sonrisa pensó: «Misión cumplida... y ahora, a seguir adelante»."
 ],

["Welcome to ¡ÓRALE!","This app is your complete Mexican Spanish training system: a 26-week curriculum, a smart flashcard engine, speaking drills, games, tests and a progress dashboard — all in one offline file.<br><br>The interface is deliberately in Spanish (that is part of the immersion), but this tutorial explains every single word and feature in English. You can reopen it any time with the <b>?</b> button in the top bar."],
["The top bar (your character sheet)","Think of it as an RPG HUD:<br><br><b>✦ number</b> — your <i>racha</i> (streak): consecutive days with activity. Do not break it.<br><b>$ number</b> — <i>pesos</i>, the in-app currency you earn from achievements and daily chests.<br><b>Nivel X · Title</b> — your level (1-12) and rank, from Peregrino (Pilgrim) to Leyenda del Barrio (Neighborhood Legend).<br><b>XP bar</b> — everything you do earns XP: reviews, games, tests, shadowing."],
["The 5 tabs (bottom navigation)","<b>◆ Panel</b> = Dashboard. Stats, daily missions, charts, weak spots.<br><b>✎ Estudiar</b> = Study. Flashcards, new words, repair drills, shadowing booth.<br><b>⚔ Arena</b> = Games. Six fast mini-games for low-time days.<br><b>❧ Códice</b> = Codex. The full 26-week curriculum, weekly exams, external resources and the method itself.<br><b>♪ Cantina</b> = The fun stuff. Slang, idioms, false friends, free cognate vocabulary, fun facts and the media library (songs, series, movies, channels)."],
["Panel — your dashboard","Top numbers: <i>palabras vistas</i> = words you have seen, <i>dominadas</i> = mastered (long-term memory), <i>total invertido</i> = total hours logged (the app tracks time automatically while open).<br><br><b>Misiones de hoy</b> = today's 4 missions. Complete all four and a reward chest opens (random pesos, bonus XP or a locked fun fact).<br><br>Below: a 14-day minutes chart (orange bar = you hit the 60-min target), mastery by category, <i>Zonas débiles</i> (your most-missed words) and your achievement wall (<i>Logros</i>).<br><br><b>Análisis</b> (Ver análisis completo) opens the deep-dive stats room: a 90-day retention curve, a 14-day forecast of upcoming reviews, a week-by-week mastery heatmap, your projected finish date for the 170-hour goal, and a CSV export of your full review log. A demo button fills it with sample data so you can see what the charts will look like."],
["Estudiar — the memory workshop","Six tools:<br><br><b>Repaso (SRS)</b> — spaced repetition review. The system schedules each card right before you would forget it. This is the engine of the whole app.<br><b>Tarjetas nuevas</b> — learn new cards, capped at 15/day so retention stays high.<br><b>Reparación</b> — a targeted drill built from your own mistakes.<br><b>Cabina de sombra</b> — the shadowing booth (next page).<br><b>Conjugación</b> — the verb trainer (two pages from now).<br><b>Diálogos</b> — the Listening Lab: two-voice mini-dialogues with comprehension questions, unlocked as you advance weeks."],
["Conjugación — the verb trainer","Twelve of the highest-value Spanish verbs (ser, estar, tener, ir, querer, poder, hacer, decir, saber, poner, venir, dar), drilled across four tenses: present, preterite, imperfect, and the ir + a + infinitive future (voy a + verb — the same trick from week 5).<br><br>Each prompt gives you a person, a verb and a time cue — for example <i>yo + tener + ayer</i>. Say the conjugated form out loud first (<i>tuve</i>), then either type it or tap <b>No sé, dame opciones</b> for multiple choice.<br><br>Mistakes are tracked just like flashcards and bias future rounds toward your weak spots. A finished round counts toward your daily missions and earns XP."],
["How to review a flashcard","1. A Spanish word appears and is spoken aloud. <b>Say it out loud</b>, then say the English meaning from memory.<br>2. Tap the card to flip and check.<br>3. Grade yourself honestly:<br><b>Otra vez</b> (Again) = forgot; card returns in minutes.<br><b>Difícil</b> (Hard) = barely got it; ~1 day.<br><b>Bien</b> (Good) = got it; interval grows (2 days, then ~5, ~12, ~30...).<br><b>Fácil</b> (Easy) = instant recall; interval grows faster.<br><br>The ♪ button replays the audio. Honest grading is what makes the algorithm work."],
["Cabina de sombra — the speaking engine","This is the Pimsleur technique, at home: listen to a phrase (<b>♪ Escuchar</b>), then immediately imitate it out loud, matching speed and rhythm. Use <b>− lento / + rápido</b> to slow down or speed up the voice. When you can match the phrase, press <b>Rep lograda ✓</b> to log it (+8 XP).<br><br><b>🎙 Grabar mi voz</b> lets you record yourself saying the phrase, then <b>▶ Escuchar mi grabación</b> plays it back so you can A/B compare against <b>♪ Comparar con nativo</b>. <b>🗑 Descartar</b> clears it so you can try again — recordings never leave your browser's memory (no upload, nothing saved to disk), and the feature quietly disables itself if your browser or setup doesn't support microphone access.<br><br>Ten minutes of this daily does more for your accent and fluency than any other exercise in the app."],
["Arena — six mini-games","<b>Rayo</b> (Lightning) — 45 seconds of rapid-fire translation.<br><b>Oído</b> (Ear) — hear a word, pick the meaning.<br><b>Trampa</b> (Trap) — false friends: words that look English but betray you.<br><b>Constructor</b> — rebuild a Mexican phrase from shuffled word tiles.<br><b>¿Amigo o Traidor?</b> (Friend or Traitor) — instant call: free cognate or false friend?<br><b>Asalto de Memoria</b> (Memory Raid) — 5 random old cards; fail them and they return to your review queue. The app also launches surprise raids on its own — that randomness is deliberate, it forces long-term retention."],
["Códice — the campaign plan","The parchment section. <b>El Método</b> explains the daily hour: 25 min audio course (Language Transfer, then Dreaming Spanish), 20 min in this app, 10 min shadowing, 5 min Cantina.<br><br>Six phases contain 26 weeks. Each week has: a grammar note (spoken-Spanish only), a <i>Misión hablada</i> (speaking mission — do it out loud, always), and curated free links.<br><br><b>Examen de la semana</b> = the weekly test: score 75%+ to conquer the week and unlock the next one. Failing feeds your mistakes into the Repair drill. Weeks marked <i>cerrada</i> are still locked."],
["Cantina — street Spanish and media","Tabs:<br><b>Jerga</b> = Mexican slang (güey, órale, no manches...). Readable from day one; they join your flashcards at week 19.<br><b>Dichos</b> = idioms and sayings with literal translations.<br><b>Trampas</b> = the false-friend table (embarazada ≠ embarrassed...).<br><b>Gratis</b> = cognates — hundreds of words you already own for free.<br><b>Datos</b> = fun facts about Spanish, unlocked one at a time via daily chests.<br><b>Biblioteca</b> = the full media library: songs, series, movies and the free channels that power the method."],
["Historias — Story Mode (the campaign)","<b>Estudiar &rarr; Historias</b> is your campaign mode: six graded audio-stories, one per phase, that follow Mateo &mdash; a newcomer to Mexico, much like you. Each unlocks when you reach its week (4, 8, 13, 18, 22, 26).<br><br>Read and listen paragraph by paragraph (tap <b>&#9834; Escuchar</b>; adjust speed with <b>&minus; lento / + r&aacute;pido</b>), then answer <b>5 comprehension questions</b>. About 90% of each story uses vocabulary you have already unlocked, so it doubles as review. Finishing a story earns XP and marks it <i>le&iacute;da</i> &mdash; collect all six to become Cronista de &Oacute;ralelandia."],
["Jefes de Fase y el Árbol de Habilidades","<b>Arena &rarr; Jefes de Fase</b> turns each phase-end into a boss fight: a timed, mixed-skill duel (vocabulary, listening, grammar, conjugation and slang) with a health bar for you and one for the boss. Each correct answer damages the boss; each miss (or letting the timer run out) damages you. Land enough hits to reach <b>80%+</b> and you win the fight and its badge &mdash; three misses and the boss wins. There are six bosses, one per phase, unlocking at weeks 4, 8, 13, 18, 22 and 26.<br><br><b>Arena &rarr; &Aacute;rbol de Habilidades</b> is your RPG character sheet: five branches &mdash; Vocabulario, O&iacute;do, Voz, Gram&aacute;tica and Callejero &mdash; that level up on their own from what you already do (mastered cards, dialogues and stories, shadowing reps, conjugation rounds, and slang learned). Aim to push all five to level 5."],
["Install it like a real app","ÓRALE is now a PWA (progressive web app). Opened from a web address — GitHub Pages once published, or locally with <i>npx serve app</i> — Chrome and Edge show an <b>install icon</b> in the address bar. Installing gives you a standalone window, its own icon, and full offline operation via a version-aware cache (updates arrive automatically when the app version changes).<br><br>Nothing is required, though: double-clicking <i>orale.html</i> from disk works exactly as it always has, and your progress stays in whichever browser profile you use. One caveat — the installed app and the double-clicked file count as different origins, so keep using one or move progress across with <b>Exportar/Importar datos</b> in ⚙ Ajustes."],
["Your first week, concretely","Day 1 (today): finish this tutorial, then <b>Estudiar → Aprender nuevas</b> and do your first 15 cards. Open the Códice, read Week 1, and start Language Transfer track 1 from the link.<br><br>Daily: clear the 4 missions (15 reviews, 1 game, 1 shadow rep, 1 conjugation round). Sunday: take the Week 1 exam in the Códice.<br><br>That is the whole system. One hour a day, honestly graded, spoken out loud. Anselmo — the scribe who comments from the parchment note — will keep you company. ¡Vámonos!"]
];
let TUTI=0;
function openTutorial(){TUTI=0;tutPage()}
function tutPage(){const last=TUTI===TUT.length-1;
 modal('<div class="q-meta"><span>TUTORIAL</span><span>'+(TUTI+1)+' / '+TUT.length+'</span></div><h3>'+TUT[TUTI][0]+'</h3><p class="muted" style="font-size:.88rem;line-height:1.6">'+TUT[TUTI][1]+'</p><div class="grid2" style="margin-top:16px"><button class="btn ghost" '+(TUTI===0?"disabled":"")+' onclick="TUTI--;tutPage()">Back</button><button class="btn" onclick="'+(last?"tutDone()":"TUTI++;tutPage()")+'">'+(last?"Start learning":"Next")+'</button></div>'+(last?"":'<button class="btn sm ghost wide" style="margin-top:8px" onclick="tutDone()">Skip tutorial</button>'))}
function tutDone(){if(!S.tut){S.tut=true;addXP(25);toast("+25 XP · Tutorial complete")}S.tut=true;save();closeModal();go("panel")}

/* ================= PWA (S10) ================= */
function pwaInit(){/* Register the service worker ONLY when it can actually work: needs browser support
 and an http(s) origin. Double-clicked from disk (file://) this is a silent no-op — the
 single-file offline path stays exactly as it always was. */
 if(!("serviceWorker" in navigator))return false;
 if(typeof location==="undefined"||(location.protocol!=="https:"&&location.protocol!=="http:"))return false;
 navigator.serviceWorker.register("sw.js?v="+APP_VERSION).catch(()=>{});return true}
/* ================= INIT ================= */
setInterval(()=>{if(document.visibilityState==="visible"){day().min+=0.5;save()}},30000);
document.addEventListener("keydown",e=>{var fc=document.getElementById("fc");if(!fc)return;if(e.key===" "||e.code==="Space"){e.preventDefault();fc.classList.toggle("flip")}else if(e.key>="1"&&e.key<="4"){ans(+e.key-1)}});
pwaInit();persistStorage();
document.querySelector("#btn-help").addEventListener("click",openTutorial);
renderHeader();go("panel");
if(!S.tut){setTimeout(openTutorial,500)}else{setTimeout(()=>{buddy(pick(AN.greet))},900);}
if(Math.random()<0.3)setTimeout(()=>memoryRaid(false),4000);
